name: QA - Pytest sem Supabase

on:
  push:
    paths:
      - 'backend/**'
      - 'testeQA/**'
      - '.github/workflows/qa-pytest.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'testeQA/**'
      - '.github/workflows/qa-pytest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias para testes isolados
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Executar testes sem banco real
        run: python -m pytest -v testeQA/testes_api/test_api_sem_banco.py --junitxml=relatorio-pytest.xml
      - name: Armazenar relatorio do Pytest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-pytest
          path: relatorio-pytest.xml
          if-no-files-found: ignore
